{% extends "core/base.html" %}

{% block title %}Notifications{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card shadow-sm border-0 rounded-4 p-4">
        <h3 class="fw-bold mb-3">Admin Notifications</h3>
        <p class="text-muted">Recent system activity and admin updates.</p>
        <div class="list-group">
            {% for item in recent_activity %}
            <div class="list-group-item">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h6 class="mb-1">{{ item.title }}</h6>
                        <p class="mb-0 text-muted">{{ item.message }}</p>
                    </div>
                    <span class="badge bg-light text-dark">New</span>
                </div>
            </div>
            {% empty %}
            <div class="text-muted">No notifications yet.</div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
