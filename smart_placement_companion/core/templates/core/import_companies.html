{% extends "core/base.html" %}

{% block title %}Bulk Company Upload{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card shadow-sm border-0 rounded-4 p-4">
        <h3 class="fw-bold mb-3">Bulk Company Upload</h3>
        <p class="text-muted">Upload a CSV file with columns like <strong>name, location, role, package, min_cgpa, branch, required_skills, eligibility</strong>.</p>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="file">Upload CSV File</label>
                <input type="file" class="form-control" id="file" name="file" accept=".csv" required>
            </div>
            <button type="submit" class="btn btn-primary-custom">Upload Companies</button>
            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary ms-2">Back to Dashboard</a>
        </form>
    </div>
</div>
{% endblock %}
